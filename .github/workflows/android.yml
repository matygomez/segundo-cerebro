# Arma la app de Android y la publica en "Releases" de GitHub, de donde se baja
# con el link fijo .../releases/latest/download/segundo-cerebro.apk
# Corre sola cuando cambia algo de android/. La clave de la firma va en el
# secreto CLAVE_FIRMA del repo (Settings → Secrets and variables → Actions).
name: App Android

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  armar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Armar el APK
        working-directory: android
        env:
          CLAVE_FIRMA: ${{ secrets.CLAVE_FIRMA }}
        run: |
          gradle compileReleaseJavaWithJavac --no-daemon
          if [ -z "$CLAVE_FIRMA" ]; then echo "::error::Falta el secreto CLAVE_FIRMA: el código compila, pero no se puede firmar la app."; exit 1; fi
          gradle assembleRelease --no-daemon
      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          codigo=$(grep -oP 'versionCode\s+\K\d+' android/app/build.gradle)
          etiqueta="android-$codigo"
          cp android/app/build/outputs/apk/release/app-release.apk segundo-cerebro.apk
          if gh release view "$etiqueta" >/dev/null 2>&1; then
            gh release upload "$etiqueta" segundo-cerebro.apk --clobber
          else
            gh release create "$etiqueta" segundo-cerebro.apk --latest \
              --title "App Android $codigo" --notes "Bajá segundo-cerebro.apk en el celular e instalalo."
          fi
